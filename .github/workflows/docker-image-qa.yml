name: Sports Genius Docker image verification
on:
  push:
    branches: [fix/eyes-telemetry-docker-sdk-20261117]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build real production image and run Dockerfile backend tests
        run: docker build --pull --progress=plain -t sports-genius-qa .
      - name: Smoke app startup with isolated in-memory storage
        run: |
          docker run -d --name sports-genius-qa -p 127.0.0.1:43000:3000 -e DB_PATH=:memory: -e NODE_ENV=test sports-genius-qa
          for i in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:43000/ >/dev/null; then exit 0; fi; sleep 2; done
          docker logs sports-genius-qa
          exit 1
