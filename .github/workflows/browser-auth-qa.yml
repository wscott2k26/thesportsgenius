name: Sports Genius Chromium browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-auth:
    name: Browser registration / login / logout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: ":memory:"
      NODE_ENV: test
      STRIPE_LIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Execute real Chromium authentication smoke test
        run: node test/browser-auth-smoke.mjs
