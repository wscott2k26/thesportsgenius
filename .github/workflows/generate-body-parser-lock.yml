name: Generate lockfile patch for body-parser advisory
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate patch in disposable checkout
        run: |
          npm audit fix --package-lock-only --omit=dev --no-audit --no-fund
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock=fs.readFileSync('package-lock.json','utf8');
          const data=JSON.parse(lock);
          console.log('PATCHED_BODY_PARSER='+data.packages?.['node_modules/body-parser']?.version);
          console.log('LOCKFILE_JSON_START');
          console.log(JSON.stringify(lock));
          console.log('LOCKFILE_JSON_END');
          JS
      - name: Verify patched dependency and all backend tests
        env:
          DB_PATH: ':memory:'
          ADMIN_EMAILS: ledger-admin@example.test
        run: |
          node -e "const x=require('./package-lock.json').packages['node_modules/body-parser'].version; if(Number(x.split('.')[1])<4)process.exit(1)"
          npm ci --no-audit --no-fund
          node --test test/*.test.js
          npm audit --omit=dev --audit-level=high
